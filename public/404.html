
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Olivé</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f8f6f0;
      color: #333b2f;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 500px;
    }

    .brand {
      font-family: Georgia, serif;
      font-size: 32px;
      letter-spacing: 3px;
      color: #697653;
      margin-bottom: 40px;
    }

    .error-code {
      font-size: 100px;
      font-weight: bold;
      color: #697653;
      margin: 0;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 30px;
      margin: 10px 0;
    }

    p {
      color: #77776e;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .home-button {
      display: inline-block;
      padding: 14px 28px;
      background: #697653;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      transition: background 0.3s ease;
    }

    .home-button:hover {
      background: #4f5b3e;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="brand">Olivé</div>

    <h1 class="error-code">404</h1>

    <h1>Page Not Found</h1>

    <p>
      Sorry, the page you're looking for doesn't exist
      or may have been moved.
    </p>

    <a class="home-button" href="/Online-Shop/">
      Back to Home
    </a>
  </main>
</body>
</html>
